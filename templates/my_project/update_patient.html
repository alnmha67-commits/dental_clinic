{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'css/update_patient.css' %}">
</head>
<body><br><br><br><br>
    <center><form action="" method="POST">
        {% csrf_token %}
        <input value="{{patient.date_of_birth|date:'Y-m-d'}}" type="date" name="date" min="1920-01-01" max="2026-01-01"  >
        <input value="{{patient.phone}}" type="tel" name="phone" pattern="[0-9]{10}" inputmode="numeric"  >
        <button type="submit" class="x">تأكيد</button>
    </form></center>
    
</body>
</html>
